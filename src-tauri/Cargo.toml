[package]
name = "arcane-fishing-bot-app"
version = "0.1.0"
edition = "2021"
default-run = "arcane-fishing-bot-app"

[dependencies]
fishing-core = { path = "../crates/fishing-core" }
anyhow = "1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
image = "0.24"
screenshots = "0.8"
enigo = "0.4.2"
base64 = "0.21"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
