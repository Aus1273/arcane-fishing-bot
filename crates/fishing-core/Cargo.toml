[package]
name = "fishing-core"
version = "0.1.0"
edition = "2021"
description = "UI-independent Arcane fishing controller and offline replay protocol"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.24", default-features = false }
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
