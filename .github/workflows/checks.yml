name: Desktop and shared-core checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-core:
    name: Portable controller and replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --locked -p fishing-core
      - run: cargo clippy --locked -p fishing-core --all-targets -- -D warnings
      - run: cargo run --locked -p fishing-core --bin fishing-core-cli -- replay tests/replays/normal-cycle.json

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - if: runner.os == 'Windows'
        run: npm run tauri build -- --no-bundle
      - if: runner.os == 'macOS'
        run: |
          npm run tauri build -- --bundles app
          codesign --verify --deep --strict --verbose=2 "target/release/bundle/macos/Arcane Fishing Bot.app"
